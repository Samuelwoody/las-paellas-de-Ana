<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de vinos">
  <defs>
    <radialGradient id="bgW" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#F7E6E6"/>
      <stop offset="100%" stop-color="#B47680"/>
    </radialGradient>
    <linearGradient id="wineW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B2040"/>
      <stop offset="100%" stop-color="#4A0F20"/>
    </linearGradient>
    <linearGradient id="glassW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="bottleW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3a2a"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgW)"/>
  <ellipse cx="400" cy="555" rx="300" ry="22" fill="rgba(0,0,0,0.2)"/>

  <!-- Wine bottle -->
  <g transform="translate(260 120)">
    <!-- Cork -->
    <rect x="-10" y="-60" width="20" height="30" rx="2" fill="#C89A5A"/>
    <!-- Neck -->
    <rect x="-14" y="-30" width="28" height="80" fill="url(#bottleW)"/>
    <!-- Shoulder and body -->
    <path d="M-14 50 Q -60 80 -60 140 L -60 360 Q -60 380 0 380 Q 60 380 60 360 L 60 140 Q 60 80 14 50 Z" fill="url(#bottleW)"/>
    <!-- Foil wrap -->
    <rect x="-16" y="-30" width="32" height="60" fill="#8B2040"/>
    <!-- Label -->
    <rect x="-48" y="150" width="96" height="130" fill="#FFF8E7"/>
    <rect x="-48" y="150" width="96" height="18" fill="#8B2040"/>
    <rect x="-48" y="262" width="96" height="18" fill="#8B2040"/>
    <text x="0" y="210" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#8B2040">VINO</text>
    <text x="0" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C4A3C">RESERVA</text>
    <!-- Highlight -->
    <ellipse cx="-32" cy="180" rx="5" ry="70" fill="#fff" opacity="0.15"/>
  </g>

  <!-- Wine glass -->
  <g transform="translate(480 180)">
    <!-- Bowl -->
    <path d="M-90 0 Q -90 140 0 140 Q 90 140 90 0 Z" fill="url(#glassW)" stroke="#d0b7be" stroke-width="2"/>
    <!-- Wine -->
    <path d="M-80 20 Q -80 132 0 132 Q 80 132 80 20 Z" fill="url(#wineW)"/>
    <!-- Surface ellipse -->
    <ellipse cx="0" cy="20" rx="80" ry="10" fill="#6a1530" opacity="0.8"/>
    <!-- Stem -->
    <rect x="-4" y="140" width="8" height="140" fill="url(#glassW)" stroke="#d0b7be" stroke-width="1"/>
    <!-- Base -->
    <ellipse cx="0" cy="286" rx="60" ry="10" fill="url(#glassW)" stroke="#d0b7be" stroke-width="2"/>
    <!-- Highlight -->
    <path d="M-70 10 Q -78 60 -60 110" fill="none" stroke="#fff" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- Grapes cluster -->
  <g transform="translate(640 380)">
    <g fill="#6A2C5B">
      <circle cx="0" cy="0" r="14"/><circle cx="-20" cy="-8" r="13"/><circle cx="20" cy="-8" r="13"/>
      <circle cx="-10" cy="16" r="13"/><circle cx="12" cy="18" r="13"/>
      <circle cx="-26" cy="16" r="12"/><circle cx="28" cy="16" r="12"/>
      <circle cx="0" cy="36" r="12"/><circle cx="-16" cy="38" r="11"/><circle cx="18" cy="38" r="11"/>
      <circle cx="-4" cy="-22" r="12"/>
    </g>
    <g fill="#8A4577" opacity="0.85">
      <circle cx="-14" cy="-12" r="5"/><circle cx="8" cy="-4" r="5"/><circle cx="-4" cy="10" r="5"/>
    </g>
    <!-- Stem and leaf -->
    <path d="M-4 -34 Q -4 -50 10 -52" fill="none" stroke="#5a3310" stroke-width="3"/>
    <path d="M10 -52 Q 30 -62 42 -50 Q 38 -34 20 -36 Q 6 -38 10 -52 Z" fill="#4F7A2B"/>
  </g>
</svg>
