<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de cervezas">
  <defs>
    <radialGradient id="bgB" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFF8DA"/>
      <stop offset="100%" stop-color="#E5C873"/>
    </radialGradient>
    <linearGradient id="beerB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD75E"/>
      <stop offset="100%" stop-color="#C4800F"/>
    </linearGradient>
    <linearGradient id="foamB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3EADC"/>
    </linearGradient>
    <linearGradient id="glassB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="bottleB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F7A2B"/>
      <stop offset="100%" stop-color="#1f3510"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgB)"/>
  <ellipse cx="400" cy="555" rx="300" ry="22" fill="rgba(0,0,0,0.15)"/>

  <!-- Beer bottle -->
  <g transform="translate(250 140)">
    <path d="M-30 0 L -30 -46 Q -30 -56 -18 -56 L 18 -56 Q 30 -56 30 -46 L 30 0 L 44 50 L 44 340 Q 44 360 0 360 Q -44 360 -44 340 L -44 50 Z" fill="url(#bottleB)"/>
    <rect x="-18" y="-70" width="36" height="18" rx="3" fill="#8a6110"/>
    <rect x="-42" y="110" width="84" height="90" fill="#C0392B"/>
    <text x="0" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="26" fill="#FFF8E7">CERVEZA</text>
    <ellipse cx="-26" cy="120" rx="5" ry="60" fill="#fff" opacity="0.15"/>
  </g>

  <!-- Beer glass -->
  <g transform="translate(460 200)">
    <!-- Glass body -->
    <path d="M-76 0 L 76 0 L 64 260 Q 64 280 0 280 Q -64 280 -64 260 Z" fill="url(#glassB)" stroke="#d1bb7a" stroke-width="2"/>
    <!-- Beer fill -->
    <path d="M-70 30 L 70 30 L 58 256 Q 58 272 0 272 Q -58 272 -58 256 Z" fill="url(#beerB)"/>
    <!-- Foam head -->
    <ellipse cx="0" cy="20" rx="76" ry="28" fill="url(#foamB)"/>
    <ellipse cx="-28" cy="6" rx="22" ry="14" fill="#fff"/>
    <ellipse cx="24" cy="10" rx="20" ry="12" fill="#fff"/>
    <ellipse cx="10" cy="-6" rx="18" ry="10" fill="#fff"/>
    <ellipse cx="-40" cy="-4" rx="14" ry="8" fill="#fff"/>
    <ellipse cx="38" cy="-8" rx="16" ry="9" fill="#fff"/>
    <!-- Bubbles in beer -->
    <g fill="#fff" opacity="0.8">
      <circle cx="-30" cy="80" r="4"/><circle cx="10" cy="120" r="3"/><circle cx="30" cy="90" r="3.5"/>
      <circle cx="-20" cy="160" r="3"/><circle cx="20" cy="180" r="2.5"/><circle cx="-10" cy="220" r="3"/>
      <circle cx="30" cy="240" r="2.5"/><circle cx="-40" cy="200" r="2.5"/>
    </g>
    <!-- Handle -->
    <path d="M76 40 Q 120 40 120 120 Q 120 200 76 200" fill="none" stroke="#d1bb7a" stroke-width="12" stroke-linecap="round"/>
    <path d="M76 40 Q 120 40 120 120 Q 120 200 76 200" fill="none" stroke="url(#glassB)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Small can -->
  <g transform="translate(640 340)">
    <rect x="-30" y="-70" width="60" height="160" rx="6" fill="#C0392B"/>
    <rect x="-30" y="-70" width="60" height="16" rx="6" fill="#8a2319"/>
    <rect x="-30" y="80" width="60" height="10" rx="3" fill="#8a2319"/>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFF8E7">BEER</text>
    <ellipse cx="-20" cy="10" rx="4" ry="60" fill="#fff" opacity="0.25"/>
  </g>
</svg>
