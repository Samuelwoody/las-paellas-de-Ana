<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de refrescos">
  <defs>
    <radialGradient id="bgR" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#E4F4FB"/>
      <stop offset="100%" stop-color="#A5D0E0"/>
    </radialGradient>
    <linearGradient id="colaR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A2E18"/>
      <stop offset="100%" stop-color="#23100a"/>
    </linearGradient>
    <linearGradient id="orangeR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB64A"/>
      <stop offset="100%" stop-color="#E07A15"/>
    </linearGradient>
    <linearGradient id="glassR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgR)"/>
  <ellipse cx="400" cy="555" rx="300" ry="22" fill="rgba(0,0,0,0.15)"/>

  <!-- Cola bottle -->
  <g transform="translate(260 120)">
    <path d="M-40 0 L -40 -30 L 40 -30 L 40 0 L 50 40 L 50 320 Q 50 360 0 360 Q -50 360 -50 320 L -50 40 Z" fill="url(#colaR)"/>
    <rect x="-40" y="-38" width="80" height="20" rx="4" fill="#1a0806"/>
    <rect x="-44" y="100" width="88" height="90" fill="#fff" opacity="0.92"/>
    <text x="0" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#C0392B">COLA</text>
    <ellipse cx="-30" cy="80" rx="6" ry="40" fill="#fff" opacity="0.25"/>
  </g>

  <!-- Glass of orange soda -->
  <g transform="translate(440 200)">
    <path d="M-70 0 L 70 0 L 56 240 Q 56 260 0 260 Q -56 260 -56 240 Z" fill="url(#glassR)" stroke="#bcd3db" stroke-width="2"/>
    <path d="M-62 14 L 62 14 L 50 238 Q 50 254 0 254 Q -50 254 -50 238 Z" fill="url(#orangeR)" opacity="0.95"/>
    <!-- Ice cubes -->
    <rect x="-40" y="40" width="30" height="30" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="10" y="60" width="28" height="28" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="-10" y="100" width="26" height="26" rx="4" fill="#ffffff" opacity="0.5"/>
    <!-- Bubbles -->
    <g fill="#fff" opacity="0.8">
      <circle cx="-20" cy="180" r="4"/><circle cx="10" cy="200" r="3"/><circle cx="30" cy="160" r="3.5"/>
      <circle cx="-30" cy="140" r="2.5"/><circle cx="20" cy="120" r="2.5"/>
    </g>
    <!-- Straw -->
    <rect x="30" y="-30" width="8" height="80" rx="3" fill="#E94B35"/>
    <rect x="30" y="-30" width="4" height="80" fill="#fff" opacity="0.5"/>
    <!-- Orange slice -->
    <g transform="translate(-40 -8)">
      <circle r="18" fill="#FFB64A"/>
      <circle r="14" fill="#FEEC8F" opacity="0.8"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#e07a15" stroke-width="1.2"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#e07a15" stroke-width="1.2"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#e07a15" stroke-width="1.2"/>
      <line x1="-10" y1="10" x2="10" y2="-10" stroke="#e07a15" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Water bottle small -->
  <g transform="translate(610 260)">
    <rect x="-30" y="-30" width="60" height="180" rx="18" fill="#C4E8F5" opacity="0.85" stroke="#7ebbcd" stroke-width="2"/>
    <rect x="-14" y="-52" width="28" height="22" rx="4" fill="#4da1bd"/>
    <rect x="-22" y="20" width="44" height="50" fill="#fff" opacity="0.85"/>
    <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#2d6478">AGUA</text>
    <ellipse cx="-18" cy="30" rx="4" ry="50" fill="#fff" opacity="0.35"/>
  </g>
</svg>
