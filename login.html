<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Acceso · Las Paellas de Ana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="assets/admin.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23F5B400'/%3E%3Ccircle cx='50' cy='50' r='35' fill='%23C0392B'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-size='40' fill='%23FFF8E7' font-family='serif'%3EA%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="config.js" defer></script>
    <script src="assets/js/supabase-client.js" defer></script>
</head>
<body class="auth-body">
    <main class="auth-wrap">
        <a href="index.html" class="auth-back">← Volver a la web</a>
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-mark">A</span>
                <div>
                    <div class="brand-name">Las Paellas de Ana</div>
                    <div class="brand-sub">Panel de Ana</div>
                </div>
            </div>
            <h1>Hola Ana 👋</h1>
            <p class="auth-lead">Accede con tu email y contraseña para gestionar el menú.</p>

            <form id="loginForm" class="auth-form" novalidate>
                <label>
                    <span>Email</span>
                    <input type="email" name="email" autocomplete="email" required placeholder="ana@laspaellasdeana.com">
                </label>
                <label>
                    <span>Contraseña</span>
                    <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
                </label>
                <button type="submit" class="btn btn-primary btn-lg auth-submit">Entrar</button>
                <div class="auth-error" id="authError" role="alert" hidden></div>
            </form>

            <p class="auth-hint">¿Sin cuenta? Pide a tu administrador que te invite desde Supabase.</p>
        </div>
    </main>

    <script>
        (function () {
            'use strict';

            const form = document.getElementById('loginForm');
            const errorEl = document.getElementById('authError');
            const submitBtn = form.querySelector('.auth-submit');

            function showError(msg) {
                errorEl.textContent = msg;
                errorEl.hidden = false;
            }
            function clearError() {
                errorEl.hidden = true;
                errorEl.textContent = '';
            }

            async function redirectIfLoggedIn() {
                if (!window.lpdaSupabase) return;
                const { data } = await window.lpdaSupabase.auth.getSession();
                if (data && data.session) window.location.replace('admin.html');
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearError();

                if (!window.lpdaConfigIsReady) {
                    showError('Supabase aún no está configurado. Revisa config.js y supabase/SETUP.md.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Entrando…';

                const formData = new FormData(form);
                const email = String(formData.get('email') || '').trim();
                const password = String(formData.get('password') || '');

                try {
                    const { data, error } = await window.lpdaSupabase.auth.signInWithPassword({
                        email, password
                    });
                    if (error) throw error;
                    if (data && data.session) {
                        window.location.replace('admin.html');
                        return;
                    }
                    showError('No se pudo iniciar sesión. Prueba de nuevo.');
                } catch (err) {
                    showError(err && err.message ? err.message : 'Error al iniciar sesión.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Entrar';
                }
            });

            window.addEventListener('load', () => {
                setTimeout(redirectIfLoggedIn, 50);
            });
        })();
    </script>
</body>
</html>
